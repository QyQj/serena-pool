name: Publish packages

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      github_packages_run_id:
        description: Release run ID to copy to GitHub Packages
        type: string
        required: false

permissions:
  contents: read

jobs:
  pack:
    if: github.event_name != 'workflow_dispatch' || inputs.github_packages_run_id == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Build and pack
        id: pack
        shell: bash
        run: |
          project=src/SerenaPool/SerenaPool.csproj
          version=$(dotnet msbuild "$project" -nologo -getProperty:PackageVersion)
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the package version v$version."
            exit 1
          fi
          dotnet build SerenaPool.slnx -c Release -p:ContinuousIntegrationBuild=true
          dotnet pack "$project" -c Release --no-build -o "$RUNNER_TEMP/nuget" -p:ContinuousIntegrationBuild=true
          test -f "$RUNNER_TEMP/nuget/SerenaPool.$version.nupkg"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Run packaged tool
        env:
          PACKAGE_VERSION: ${{ steps.pack.outputs.version }}
        run: dotnet tool exec "SerenaPool@$PACKAGE_VERSION" --source "$RUNNER_TEMP/nuget" -- --help
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref_type == 'tag'
        with:
          name: nuget
          path: ${{ runner.temp }}/nuget/*.nupkg
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: pack
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages
      - name: NuGet login
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Push package
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push 'packages/*.nupkg' --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

  publish-github:
    needs: pack
    if: >-
      ${{ !cancelled() &&
          ((github.event_name == 'push' && github.ref_type == 'tag' && needs.pack.result == 'success') ||
           (github.event_name == 'workflow_dispatch' && inputs.github_packages_run_id != '')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget
          path: packages
          github-token: ${{ github.token }}
          run-id: ${{ inputs.github_packages_run_id || github.run_id }}
      - name: Push to GitHub Packages
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: dotnet nuget push 'packages/SerenaPool.*.nupkg' --source "https://nuget.pkg.github.com/$GITHUB_REPOSITORY_OWNER/index.json" --api-key "$GITHUB_PACKAGES_TOKEN" --skip-duplicate
