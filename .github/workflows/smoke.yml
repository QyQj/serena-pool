name: Native smoke tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install Serena
        run: |
          python -m venv "$RUNNER_TEMP/serena"
          "$RUNNER_TEMP/serena/bin/python" -m pip install serena-agent==2.1.0
          echo "$RUNNER_TEMP/serena/bin" >> "$GITHUB_PATH"
          echo "Pool__Executable=$RUNNER_TEMP/serena/bin/serena" >> "$GITHUB_ENV"
      - name: Run the full smoke suite
        run: |
          serena --version
          dotnet run --project tests/SerenaPool.Smoke -c Release -- "$RUNNER_TEMP"
