<!doctype html>
<html lang="{{Language}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{DashboardTitle}}</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js?lang={{Language}}" defer></script>
</head>
<body>
<header class="bar"><div class="shell bar-inner">
  <a class="brand" href="/?lang={{Language}}"><span class="mark" aria-hidden="true">≋</span> Serena Pool</a>
  <div class="bar-actions">
    <span id="connection" class="connection">{{DashboardConnecting}}</span>
    <a href="/?lang={{AlternateLanguage}}" lang="{{AlternateLanguage}}" hreflang="{{AlternateLanguage}}">{{AlternateLanguageLabel}}</a>
  </div>
</div></header>
<main class="shell">
  <section aria-labelledby="pool-title">
    <div class="heading"><div><h1 id="pool-title">{{DashboardPool}}</h1><p id="summary"></p></div>
      <button id="refresh" type="button">{{DashboardRefresh}}</button>
    </div>
    <div class="surface table-wrap" role="region" aria-labelledby="pool-title" tabindex="0">
      <table><thead><tr><th scope="col">{{DashboardWorkdir}}</th><th scope="col">{{DashboardStatus}}</th><th scope="col">{{DashboardLeases}}</th><th scope="col">{{DashboardQueue}}</th><th scope="col">{{DashboardActions}}</th></tr></thead>
        <tbody id="rows"></tbody></table>
      <div id="empty" hidden><strong>{{DashboardEmpty}}</strong><p>{{DashboardEmptyHint}}</p></div>
    </div>
    <section id="detail" class="surface" hidden aria-labelledby="detail-title"></section>
    <p class="foot">{{DashboardLastSync}} <time id="updated">—</time></p>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
</main>
</body>
</html>
