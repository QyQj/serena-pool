<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Serena Pool · 实例管理</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
<header class="bar"><div class="shell bar-inner">
  <a class="brand" href="/"><span class="mark" aria-hidden="true">≋</span> Serena Pool</a>
  <span id="connection" class="connection">正在连接</span>
</div></header>
<main class="shell">
  <section aria-labelledby="pool-title">
    <div class="heading"><div><h1 id="pool-title">实例池</h1><p id="summary"></p></div>
      <button id="refresh" type="button">刷新</button>
    </div>
    <div class="surface table-wrap" role="region" aria-labelledby="pool-title" tabindex="0">
      <table><thead><tr><th scope="col">工作目录</th><th scope="col">状态</th><th scope="col">领用</th><th scope="col">执行 / 排队</th><th scope="col">操作</th></tr></thead>
        <tbody id="rows"></tbody></table>
      <div id="empty" hidden><strong>暂无实例</strong><p>Agent 调用 <code>acquire(workdir)</code> 后，实例会显示在这里。</p></div>
    </div>
    <section id="detail" class="surface" hidden aria-labelledby="detail-title"></section>
    <p class="foot">最近同步 <time id="updated">—</time></p>
  </section>
  <p id="notice" role="status" aria-live="polite"></p>
</main>
</body>
</html>
